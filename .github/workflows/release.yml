# Build each network's guest from one tag and publish the artifacts.
#
# A tag push builds every network in versions.toml networks and publishes
# zns-<network>-* files in one release, with no upgrade document.
#
# Running the workflow on a tag adds an upgrade document for one network.
# It does not build: it downloads that tag's published, attested initrd and
# measurement for the network and packs the document against those bytes,
# then adds only zns-<network>-upgrade.bin and .toml to the release.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      network:
        description: Network of the source guest
        required: true
        type: choice
        options:
          - mainnet
          - testnet
      from_measurement:
        description: Source guest measurement, 48 bytes hex
        required: true
        type: string
      seed_fingerprint:
        description: ZIP-32 seed fingerprint, 32 bytes hex
        required: true
        type: string
      source_capsule_hash:
        description: BLAKE2b-256 of the source capsule file, 32 bytes hex
        required: true
        type: string
      sequence:
        description: Upgrade sequence
        required: true
        type: string
      from_guest_policy:
        description: Source guest policy, for example 0x30000
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  networks:
    name: networks
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    outputs:
      list: ${{ steps.read.outputs.list }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Read networks
        id: read
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, tomllib
          networks = tomllib.loads(open("versions.toml").read())["networks"]
          print("list=" + json.dumps(networks))
          PY

  build:
    name: zns-${{ matrix.network }}
    needs: networks
    runs-on: ubuntu-24.04-16core
    strategy:
      fail-fast: true
      matrix:
        network: ${{ fromJSON(needs.networks.outputs.list) }}
    env:
      SCCACHE_GHA_ENABLED: "on"
      RUSTC_WRAPPER: sccache
      NETWORK: ${{ matrix.network }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install build packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ca-certificates cmake curl git \
            libssl-dev pkg-config protobuf-compiler python3 python3-venv zstd

      - name: Read Rust pin
        id: rust
        run: |
          version="$(sed -n 's/^rust_version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' versions.toml | head -n 1)"
          test -n "$version"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: ${{ steps.rust.outputs.version }}

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Cache guest downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/kernel
            build/ovmf
          key: guest-downloads-${{ hashFiles('versions.toml') }}

      - name: Build guest image
        env:
          ZNS_RELEASE: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: ./image/build-image.sh "$NETWORK"

      - name: sccache stats
        if: always()
        run: ${SCCACHE_PATH} --show-stats

      - name: Install SNP measurement tool
        run: ./launch/install-snp-measure.sh

      - name: Compute expected SNP measurement
        run: ./launch/measure-guest.sh

      # Published names are zns-<network>-<name>, with a leading zns- dropped
      # from <name>: build/bin/zns-mint becomes zns-mainnet-mint.
      - name: Name release files
        run: |
          prefix="zns-${NETWORK}-"
          out=build/release
          rm -rf "$out"
          mkdir -p "$out"
          cp build/zns-initrd.img "$out/${prefix}initrd.img"
          for path in build/bin/*; do
            name="$(basename "$path")"
            cp "$path" "$out/${prefix}${name#zns-}"
          done
          cp build/snp-measurement.txt "$out/${prefix}snp-measurement.txt"

      - name: Generate release manifest
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import subprocess

          root = pathlib.Path(".")
          network = os.environ["NETWORK"]
          prefix = f"zns-{network}-"
          out = root / "build" / "release"
          pins = {}
          for line in (root / "versions.toml").read_text().splitlines():
              line = line.split("#", 1)[0].strip()
              if not line or "=" not in line:
                  continue
              key, val = line.split("=", 1)
              pins[key.strip()] = val.strip().strip('"')

          # The initrd and every build/bin program, by their published names.
          names = [f"{prefix}initrd.img"]
          for path in sorted((root / "build" / "bin").iterdir()):
              short = path.name.removeprefix("zns-")
              names.append(f"{prefix}{short}")
          artifacts = []
          for name in names:
              digest = hashlib.sha256((out / name).read_bytes()).hexdigest()
              artifacts.append({"name": name, "sha256": digest})

          measurement = (root / "build" / "snp-measurement.txt").read_text().strip()
          text = subprocess.check_output(["./launch/print-guest-config.sh"], text=True)
          params = {}
          for line in text.splitlines():
              key, val = line.split("=", 1)
              params[key] = val

          manifest = {
              "network": network,
              "mint_commit": pins.get("mint_commit", ""),
              "keygen_commit": pins.get("keygen_commit", ""),
              "migrate_commit": pins.get("migrate_commit", ""),
              "canon_commit": pins.get("canon_commit", ""),
              "zebra_commit": pins.get("zebra_commit", ""),
              "zebra_version": pins.get("zebra_version", ""),
              "kernel_version": pins.get("kernel_version", ""),
              "rust_version": pins.get("rust_version", ""),
              "artifacts": artifacts,
              "launch": {
                  "kernel": params["kernel"],
                  "initrd": params["initrd"],
                  "cmdline": params["cmdline"],
                  "guest_policy": params["guest_policy"],
                  "kernel_hashes": params["kernel_hashes"],
                  "guest_features": params["guest_features"],
                  "cpu": params["cpu"],
                  "cpu_family": params["cpu_family"],
                  "cpu_model": params["cpu_model"],
                  "cpu_stepping": params["cpu_stepping"],
                  "vcpus": params["vcpus"],
                  "ovmf": params["ovmf"],
                  "machine": params["machine"],
                  "cbitpos": params["cbitpos"],
                  "reduced_phys_bits": params["reduced_phys_bits"],
              },
              "tee_measurement": measurement,
          }
          path = out / f"{prefix}release-manifest.json"
          path.write_text(json.dumps(manifest, indent=2) + "\n")
          print(path.read_text())
          PY

      - name: Hash release files
        run: |
          cd build/release
          sums="$(sha256sum zns-"${NETWORK}"-*)"
          printf '%s\n' "$sums" | tee "zns-${NETWORK}-SHA256SUMS"

      - name: Attest release files
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: build/release/zns-*

      - name: Keep release files for publishing
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zns-${{ matrix.network }}
          path: build/release/zns-*
          if-no-files-found: error

  # Packs an upgrade document against the image this tag already published.
  # Rebuilding would only match if the build were byte-for-byte identical.
  upgrade:
    name: zns-${{ github.event.inputs.network }}-upgrade
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    env:
      NETWORK: ${{ github.event.inputs.network }}
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Check the tag and network
        run: |
          if [[ "$GITHUB_REF_TYPE" != tag || "$TAG" != v* ]]; then
            echo "run this workflow on a v* tag, not ${GITHUB_REF}" >&2
            exit 1
          fi
          if ! grep -E '^networks[[:space:]]*=' versions.toml | grep -qF "\"${NETWORK}\""; then
            echo "network ${NETWORK} is not in versions.toml networks" >&2
            exit 1
          fi

      - name: Check upgrade inputs
        env:
          UPGRADE_FROM_MEASUREMENT: ${{ github.event.inputs.from_measurement }}
          UPGRADE_SEED_FINGERPRINT: ${{ github.event.inputs.seed_fingerprint }}
          UPGRADE_SOURCE_CAPSULE_HASH: ${{ github.event.inputs.source_capsule_hash }}
          UPGRADE_SEQUENCE: ${{ github.event.inputs.sequence }}
          UPGRADE_FROM_GUEST_POLICY: ${{ github.event.inputs.from_guest_policy }}
        run: python3 launch/pack-upgrade-document.py --check

      - name: Download the published image
        run: |
          prefix="zns-${NETWORK}-"
          mkdir -p published build
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -D published \
            -p "${prefix}initrd.img" -p "${prefix}snp-measurement.txt"
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${TAG}"
          for name in "${prefix}initrd.img" "${prefix}snp-measurement.txt"; do
            gh attestation verify "published/${name}" \
              --repo "$GITHUB_REPOSITORY" \
              --source-ref "refs/tags/${TAG}" \
              --cert-identity "$identity"
          done
          cp "published/${prefix}initrd.img" build/zns-initrd.img
          cp "published/${prefix}snp-measurement.txt" build/snp-measurement.txt

      - name: Read Rust pin
        id: rust
        run: |
          version="$(sed -n 's/^rust_version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' versions.toml | head -n 1)"
          test -n "$version"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: ${{ steps.rust.outputs.version }}

      - name: Pack canonical upgrade document
        env:
          UPGRADE_FROM_MEASUREMENT: ${{ github.event.inputs.from_measurement }}
          UPGRADE_SEED_FINGERPRINT: ${{ github.event.inputs.seed_fingerprint }}
          UPGRADE_SOURCE_CAPSULE_HASH: ${{ github.event.inputs.source_capsule_hash }}
          UPGRADE_SEQUENCE: ${{ github.event.inputs.sequence }}
          UPGRADE_FROM_GUEST_POLICY: ${{ github.event.inputs.from_guest_policy }}
        run: cargo run --quiet --release --locked --manifest-path launch/pack-upgrade/Cargo.toml

      - name: Name upgrade files
        run: |
          prefix="zns-${NETWORK}-"
          mkdir -p build/release
          cp build/upgrade.bin "build/release/${prefix}upgrade.bin"
          cp build/upgrade.toml "build/release/${prefix}upgrade.toml"

      - name: Attest upgrade files
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: build/release/zns-*

      - name: Keep upgrade files for publishing
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zns-${{ github.event.inputs.network }}-upgrade
          path: build/release/zns-*
          if-no-files-found: error

  # Runs once, after every network built (or the upgrade was packed), so a
  # release never has one network without the other.
  publish:
    name: publish
    needs: [build, upgrade]
    if: ${{ !failure() && !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Collect release files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: zns-*
          path: release
          merge-multiple: true

      - name: Upload release assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: release/zns-*
